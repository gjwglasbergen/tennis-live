[project]
name = "tennis-live"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Govert Jan Glasbergen", email = "gjwglasbergen@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.5",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tennis-live = "tennis_live:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
